name: Despliegue de Blazor PWA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar aplicación
        # Usamos **/*.csproj para que encuentre el proyecto esté donde esté
        run: dotnet publish **/*.csproj -c Release -o release

      - name: Cambiar base-href
        # Este comando busca el nombre del repo automáticamente por ti
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f 2)
          sed -i "s/<base href=\"\/\" \/>/<base href=\"\/$REPO_NAME\/\" \/>/g" release/wwwroot/index.html

      - name: Añadir .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Desplegar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages